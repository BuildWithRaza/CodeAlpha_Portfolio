<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

<defs>

<linearGradient id="royal" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#061A38"/>
 <stop offset="100%" stop-color="#1D4E89"/>
</linearGradient>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#FFF2A6"/>
 <stop offset="50%" stop-color="#D4AF37"/>
 <stop offset="100%" stop-color="#8A6500"/>
</linearGradient>

<!-- Curved Text Paths -->
<path id="schoolArc" d="M150 500 A362 362 0 0 1 874 500"/>
<path id="bottomArc" d="M270 830 A260 150 0 0 0 760 866"/>

</defs>


<!-- Background Circle -->
<circle cx="512" cy="512" r="500" fill="url(#royal)"/>


<!-- Outer Gold Ring -->
<circle cx="512" cy="512" r="465"
fill="none"
